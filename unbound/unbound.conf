server:
    verbosity: 0
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Only the container network may query this. It must never become an open
    # resolver — being behind one is the exact reason Spamhaus was refusing us, and
    # running one would be worse than the problem it solves.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow

    # No `forward-zone`. Forwarding to 1.1.1.1 would put us straight back behind a
    # public resolver and Spamhaus would refuse again — full recursion from the root
    # servers is the entire point of this container.

    # Rebinding protection is deliberately NOT enabled.
    #
    # Unbound's `private-address` option strips loopback and RFC1918 answers from
    # responses. DNSBLs reply with 127.0.0.x to mean "listed", so switching it on
    # would filter away every blocklist hit and turn every listed IP into a silent
    # clean result. Nothing here resolves attacker-supplied names for a browser to
    # connect to, so the protection buys us nothing and costs correctness.

    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    aggressive-nsec: yes

    cache-min-ttl: 60
    cache-max-ttl: 3600
    prefetch: yes
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # Blocklist zones answer from a lot of distinct nameservers; the defaults are
    # tight for this workload.
    outgoing-range: 512
    num-queries-per-thread: 256

    # DNSSEC validation, using the trust anchor the image ships and maintains.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
